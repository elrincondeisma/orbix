# Orbix — electron-builder
#
# Fuente de verdad: docs/design/01-arquitectura.md §7.
#
# PUNTO ABIERTO A1 (sin resolver): sin firmar ni notarizar. Es para el Mac de Ismael;
# si algún día se distribuye fuera hará falta Developer ID + notarización.

appId: com.icatala.orbix
productName: Orbix
copyright: © 2026 Ismael Catalá

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - resources/trayTemplate.png
  - resources/trayTemplate@2x.png
  - scripts/hook/orbix-hook.sh
  - data/snapshot-*.json

# better-sqlite3 es un módulo nativo (.node): no carga desde dentro del asar.
# El hook tiene que quedar como fichero real y ejecutable (lo copia hook-installer.ts
# a ~/.claude/orbix/), tampoco puede vivir dentro del asar.
asarUnpack:
  - "**/*.node"
  - "scripts/hook/**"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  icon: resources/icon.icns
  # Sin firmar ni notarizar (ver punto abierto A1 más arriba).
  identity: null
  extendInfo:
    LSUIElement: 1
    NSHumanReadableCopyright: © 2026 Ismael Catalá

dmg:
  title: Orbix ${version}
  contents:
    - { x: 130, y: 220, type: file }
    - { x: 410, y: 220, type: link, path: /Applications }
